name: Build CeenJs6
on:
  push:
    branches: [ceen]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ceenjs6-vsix
          path: ceenjs6-*.vsix
          if-no-files-found: error
